[project]
name = "palimpsest"
version = "0.5.0"
description = "Curated, visibly-weighted, relationship-scoped memory for AI agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.2"]
elastic = ["elasticsearch>=8.11,<9"]
# transformers 5 runs this model about 12x slower on CPU than 4.x with identical answers (measured on torch 2.14), so it is excluded
nli = ["transformers>=4.40,<5", "torch>=2.2"]
# Everything the agent-driven setup uses; Elasticsearch stays separate (experimental)
all = ["mcp>=1.2", "transformers>=4.40,<5", "torch>=2.2"]

[project.scripts]
palimpsest-mcp = "palimpsest.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["palimpsest*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
