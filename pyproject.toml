[project]
name = "palimpsest"
version = "0.4.0"
description = "Curated, visibly-weighted, relationship-scoped AI memory -- see CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "elasticsearch>=8.11,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.2"]

[project.scripts]
palimpsest-mcp = "palimpsest.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["palimpsest*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
