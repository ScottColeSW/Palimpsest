<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Palimpsest — live mesh</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14171f;
    --dim: #3a4152;
    --text: #d8dde8;
    --muted: #7d8496;
    --reinforce: #3f7d5c;
    --collide-open: #e2504a;
    --collide-resolved: #7d5ce2;
    --scope: #5c8ce2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    height: 100vh;
  }
  #graph-pane { flex: 1; position: relative; }
  svg { width: 100%; height: 100%; }
  #side {
    width: 340px;
    background: var(--panel);
    border-left: 1px solid #1f2430;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  h1 { font-size: 15px; margin: 0 0 4px; color: var(--text); }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  button {
    background: #232838;
    color: var(--text);
    border: 1px solid #333c52;
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #2c3348; }
  button:disabled { opacity: 0.4; cursor: default; }
  #controls { display: flex; gap: 8px; }
  #log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
  }
  .log-entry {
    background: #1a1f2b;
    border-left: 3px solid var(--dim);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 12.5px;
  }
  .log-entry.collide { border-left-color: var(--collide-open); }
  .log-entry.resolve { border-left-color: var(--collide-resolved); }
  .log-tick { color: var(--muted); font-size: 11px; }
  .node-label { fill: var(--text); font-size: 10px; pointer-events: none; }
  .edge-label { fill: var(--muted); font-size: 9px; pointer-events: none; }
  @keyframes pulse {
    0%, 100% { stroke-opacity: 0.5; stroke-width: 2; }
    50% { stroke-opacity: 1; stroke-width: 4; }
  }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
</style>
</head>
<body>
  <div id="graph-pane"><svg id="graph"></svg></div>
  <div id="side">
    <div>
      <h1>Palimpsest — live mesh</h1>
      <div class="sub">Scripted demo. Dim = seed, unearned. Bright pulsing red = open collision. Purple = reconciled. Hand-authored, because the placeholder classifier can detect significance, not contradiction. <a href="/ingest.html" style="color:#5c8ce2">real ingestion →</a> · <a href="/real-collision.html" style="color:#5c8ce2">real collision →</a></div>
    </div>
    <div id="controls">
      <button id="tick-btn">Tick →</button>
      <button id="reset-btn">Reset</button>
    </div>
    <div id="log"></div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
